<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hit Song Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false" width="0" height="0">
      <defs>
        <g id="i-danceability"><path d="M3 12h3l3-7 4 14 3-7h5" /></g>
        <g id="i-energy"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z" /></g>
        <g id="i-valence"><circle cx="12" cy="12" r="9" /><path d="M8.5 14a4.5 4.5 0 0 0 7 0" /><path d="M9 9.5v.01" /><path d="M15 9.5v.01" /></g>
        <g id="i-tempo"><path d="M12 4 4.5 20h15L12 4Z" /><path d="M8 14h8" /></g>
        <g id="i-loudness"><path d="M11 5 6 9H3v6h3l5 4V5Z" /><path d="M15.5 8.5a5 5 0 0 1 0 7" /><path d="M18.5 6a9 9 0 0 1 0 12" /></g>
        <g id="i-speechiness"><rect x="9" y="2" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0 0 14 0" /><path d="M12 18v3" /></g>
        <g id="i-acousticness"><circle cx="12" cy="14.5" r="6.5" /><circle cx="12" cy="14.5" r="2" /><path d="M12 8V3" /></g>
        <g id="i-instrumentalness"><rect x="3" y="5" width="18" height="14" rx="2" /><path d="M9 5v9" /><path d="M15 5v9" /><path d="M3 14h18" /></g>
        <g id="i-liveness"><circle cx="12" cy="12" r="2" /><path d="M7.8 7.8a6 6 0 0 0 0 8.4" /><path d="M16.2 7.8a6 6 0 0 1 0 8.4" /><path d="M4.9 4.9a10 10 0 0 0 0 14.2" /><path d="M19.1 4.9a10 10 0 0 1 0 14.2" /></g>
        <g id="i-duration_ms"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3.5 2" /></g>
      </defs>
    </svg>

    <main class="app">
      <section class="shell" aria-labelledby="page-title">
        <header class="hero">
          <h1 id="page-title">Hit Song Predictor</h1>
          <p class="hero-copy">
            Adjust audio features to predict chart performance. Model trained on
            Spotify audio feature data.
          </p>
        </header>

        <section class="preset-bar" aria-label="Preset track profiles">
          <span>Presets</span>
          <button type="button" class="preset-button" data-preset="pop">Pop Anthem</button>
          <button type="button" class="preset-button" data-preset="sad">Sad Ballad</button>
          <button type="button" class="preset-button" data-preset="club">Club Banger</button>
          <button type="button" class="preset-button" data-preset="lofi">Lo-Fi Chill</button>
        </section>

        <section class="main-grid">
          <form class="feature-grid" id="feature-form" aria-label="Audio feature inputs"></form>

          <aside class="results-panel" aria-label="Prediction results">
            <div class="score-widget">
              <svg class="score-svg" width="200" height="200" viewBox="0 0 200 200" aria-hidden="true">
                <circle cx="100" cy="100" r="80" class="score-track"></circle>
                <circle cx="100" cy="100" r="80" class="score-progress" id="score-progress"></circle>
              </svg>
              <div class="score-center">
                <strong id="score-value">0</strong>
                <span>/ 100</span>
              </div>
            </div>

            <div class="verdict-pill" id="verdict-pill">
              <span id="verdict-label">Chart Climber</span>
            </div>

            <svg class="radar" id="feature-radar" width="200" height="200" viewBox="0 0 200 200" aria-label="Feature radar chart"></svg>

            <section class="contributions" aria-labelledby="contribution-title">
              <h2 id="contribution-title">Top Feature Contributions</h2>
              <div class="contribution-list" id="contribution-list"></div>
            </section>

            <p class="model-note">
              This model uses weighted audio features to estimate chart potential.
              Weights derived from historical Spotify data analysis.
            </p>
          </aside>
        </section>
      </section>
      <p class="sr-only" id="score-announce" role="status" aria-live="polite"></p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
